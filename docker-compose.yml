services:
  backend:
    build: ./backend
    container_name: rachford-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: rachford-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
